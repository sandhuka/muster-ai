name: muster regression gates

# The framework's two deterministic release gates, run on every push and PR. Both are
# remote-severed and self-contained (a PATH-injected stub claude; bash line/char counts) — no
# model, no network, no secrets. Red here blocks the change, mirroring the local release rule.
on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Driver fixture (autonomous loop end-to-end)
        run: bash scripts/test-sprint-driver.sh

      - name: Pillar budgets (always-read token surface)
        run: bash scripts/test-pillar-budgets.sh
